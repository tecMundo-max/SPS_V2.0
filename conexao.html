<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Conexão Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3>Teste de Conexão Firebase</h3>
        <div id="resultado" class="alert alert-info">Testando...</div>
        <button class="btn btn-primary mt-3" onclick="testar()">Testar Conexão</button>
        <button class="btn btn-success mt-3" onclick="criarListas()">Criar Listas</button>
        
        <div class="mt-3">
            <h5>Listas Carregadas:</h5>
            <pre id="listas" class="bg-light p-3"></pre>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Configuração diretamente aqui para teste
        const firebaseConfig = {
            apiKey: "AIzaSyDYnvcRKt4qDpk08_4MQVNEOr9Iq95X980",
            authDomain: "sps003hjr.firebaseapp.com",
            databaseURL: "https://sps003hjr-default-rtdb.firebaseio.com",
            projectId: "sps003hjr",
            storageBucket: "sps003hjr.firebasestorage.app",
            messagingSenderId: "294133615625",
            appId: "1:294133615625:web:832c4db972dcb1b92cbcd8"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        console.log('Firebase inicializado');
        console.log('Database:', database);

        function testar() {
            const resultado = document.getElementById('resultado');
            resultado.className = 'alert alert-info';
            resultado.textContent = 'Testando conexão...';

            database.ref('LISTAS').once('value')
                .then((snapshot) => {
                    const dados = snapshot.val();
                    console.log('Dados recebidos:', dados);
                    
                    if (dados) {
                        resultado.className = 'alert alert-success';
                        resultado.textContent = '✅ Conexão OK! Dados encontrados.';
                        document.getElementById('listas').textContent = JSON.stringify(dados, null, 2);
                    } else {
                        resultado.className = 'alert alert-warning';
                        resultado.textContent = '⚠️ Conectado, mas sem dados em LISTAS';
                        document.getElementById('listas').textContent = 'Nenhum dado encontrado';
                    }
                })
                .catch((error) => {
                    console.error('Erro:', error);
                    resultado.className = 'alert alert-danger';
                    resultado.textContent = '❌ Erro: ' + error.message;
                    document.getElementById('listas').textContent = error.stack;
                });
        }

        function criarListas() {
            const listas = {
                cenarios: [
                    "Dados", "Voz / Ligações", "Falha no equipamento",
                    "Não localizado no SPSWeb", "HLR não informado",
                    "Franquia de dados", "Ofertas não aparecem",
                    "4G inativo", "Claro Sync", "MasterAccount",
                    "Excedentes de uso", "Outros"
                ],
                equipamentos: [
                    "RTC", "HLR", "HLREDA", "HHUA", "HSS", "VPNSIX", "SGV"
                ]
            };

            database.ref('LISTAS').set(listas)
                .then(() => {
                    alert('✅ Listas criadas com sucesso!');
                    testar();
                })
                .catch((error) => {
                    alert('❌ Erro ao criar listas: ' + error.message);
                });
        }

        // Testa automaticamente ao carregar
        window.onload = testar;
    </script>
</body>
</html>
