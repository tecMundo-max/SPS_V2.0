<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Encaminhamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <strong>SPS V2</strong> - Encaminhamentos
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="chamados.html">Chamados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="encaminhamentos.html">Encaminhamentos</a>
                    </li>
                </ul>
                <span class="navbar-text text-white me-3" id="userInfo">Desenvolvedor (SUPERVISOR)</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <!-- Seção 1: Inclusão de Email -->
        <div class="section-container mb-4">
            <div class="section-header">
                <h5><i class="bi bi-envelope-plus"></i> Inclusão de Encaminhamento</h5>
            </div>
            <div class="section-body">
                <form id="formEncaminhamento">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Analista</label>
                            <input type="text" class="form-control" id="analista" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data/Hora</label>
                            <input type="text" class="form-control" id="dataHora" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Título <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="titulo" placeholder="Título do encaminhamento" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" placeholder="email@exemplo.com" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="Pendente">Pendente</option>
                                <option value="Enviado">Enviado</option>
                                <option value="Respondido">Respondido</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Flag</label>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="flag">
                                <label class="form-check-label" for="flag">Marcar como importante</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Observações</label>
                            <textarea class="form-control" id="observacoes" rows="3" placeholder="Detalhes do encaminhamento..."></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-send"></i> Salvar Encaminhamento
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Seção 2: Pesquisa -->
        <div class="section-container mb-4">
            <div class="section-header">
                <h5><i class="bi bi-search"></i> Pesquisa</h5>
            </div>
            <div class="section-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Data Inicial</label>
                        <input type="date" class="form-control" id="dataInicial">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Final</label>
                        <input type="date" class="form-control" id="dataFinal">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control" id="filtroTitulo" placeholder="Título">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" id="filtroEmail" placeholder="Email">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filtroStatus">
                            <option value="">Todos</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Enviado">Enviado</option>
                            <option value="Respondido">Respondido</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <div class="d-grid gap-2 d-md-flex">
                            <button class="btn btn-primary btn-sm" onclick="pesquisarEncaminhamentos()">
                                <i class="bi bi-search"></i> Pesquisar
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="limparFiltros()">
                                Limpar
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mt-2">
                    <span class="badge bg-primary">Total: <span id="totalRegistros">0</span> encaminhamentos</span>
                </div>
            </div>
        </div>

        <!-- Seção 3: Resultados -->
        <div class="section-container">
            <div class="section-header">
                <h5><i class="bi bi-table"></i> Resultados</h5>
            </div>
            <div class="section-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Data/Hora</th>
                                <th>Analista</th>
                                <th>Título</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Flag</th>
                                <th>Observações</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr>
                                <td colspan="8" class="text-center">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div class="modal fade" id="modalEdicao" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">✏️ Editar Encaminhamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEdicao">
                        <input type="hidden" id="editId">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Título *</label>
                                <input type="text" class="form-control" id="editTitulo" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="editStatus">
                                    <option value="Pendente">Pendente</option>
                                    <option value="Enviado">Enviado</option>
                                    <option value="Respondido">Respondido</option>
                                    <option value="Cancelado">Cancelado</option>
                                </select>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="editEmail" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Flag</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="editFlag">
                                    <label class="form-check-label">Importante</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" id="editObservacoes" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarEdicao()">
                        <i class="bi bi-check-circle"></i> Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDYnvcRKt4qDpk08_4MQVNEOr9Iq95X980",
            authDomain: "sps003hjr.firebaseapp.com",
            databaseURL: "https://sps003hjr-default-rtdb.firebaseio.com",
            projectId: "sps003hjr",
            storageBucket: "sps003hjr.firebasestorage.app",
            messagingSenderId: "294133615625",
            appId: "1:294133615625:web:832c4db972dcb1b92cbcd8"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const USUARIO_ATUAL = {
            nome: 'Desenvolvedor',
            email: 'dev@sps.com',
            role: 'SUPERVISOR',
            isAdmin: true
        };

        // Inicializar
        async function inicializar() {
            console.log('🚀 Inicializando Encaminhamentos...');
            
            document.getElementById('userInfo').textContent = 
                `${USUARIO_ATUAL.nome} (${USUARIO_ATUAL.role})`;
            document.getElementById('analista').value = USUARIO_ATUAL.nome;
            
            atualizarDataHora();
            setInterval(atualizarDataHora, 1000);
            
            await carregarEncaminhamentos();
            
            document.getElementById('formEncaminhamento')
                .addEventListener('submit', salvarEncaminhamento);
            
            console.log('✅ Página inicializada!');
        }

        function atualizarDataHora() {
            document.getElementById('dataHora').value = new Date().toLocaleString('pt-BR');
        }

        // Salvar encaminhamento
        async function salvarEncaminhamento(event) {
            event.preventDefault();
            
            const titulo = document.getElementById('titulo').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (!titulo || !email) {
                alert('Preencha os campos obrigatórios!');
                return;
            }
            
            const dados = {
                titulo: titulo,
                email: email,
                status: document.getElementById('status').value,
                flag: document.getElementById('flag').checked,
                observacoes: document.getElementById('observacoes').value,
                analista: USUARIO_ATUAL.nome,
                createdAt: Date.now(),
                deleted: false
            };

            try {
                await database.ref('ENCAMINHAMENTOS').push(dados);
                console.log('✅ Encaminhamento salvo!');
                alert('✅ Encaminhamento criado com sucesso!');
                limparFormulario();
                await carregarEncaminhamentos();
            } catch (error) {
                console.error('❌ Erro:', error);
                alert('❌ Erro ao salvar: ' + error.message);
            }
        }

        // Carregar encaminhamentos
        async function carregarEncaminhamentos(filtros = {}) {
            try {
                const snapshot = await database.ref('ENCAMINHAMENTOS').once('value');
                const todos = [];
                
                snapshot.forEach(child => {
                    const data = child.val();
                    if (!data.deleted || USUARIO_ATUAL.isAdmin) {
                        todos.push({ id: child.key, ...data });
                    }
                });
                
                todos.sort((a, b) => b.createdAt - a.createdAt);
                
                let filtrados = todos;
                
                if (filtros.titulo) {
                    filtrados = filtrados.filter(e => 
                        e.titulo?.toLowerCase().includes(filtros.titulo.toLowerCase())
                    );
                }
                if (filtros.email) {
                    filtrados = filtrados.filter(e => 
                        e.email?.toLowerCase().includes(filtros.email.toLowerCase())
                    );
                }
                if (filtros.status) {
                    filtrados = filtrados.filter(e => e.status === filtros.status);
                }
                if (filtros.dataInicial) {
                    filtrados = filtrados.filter(e => e.createdAt >= filtros.dataInicial);
                }
                if (filtros.dataFinal) {
                    filtrados = filtrados.filter(e => e.createdAt <= filtros.dataFinal);
                }
                
                document.getElementById('totalRegistros').textContent = filtrados.length;
                
                const tbody = document.getElementById('corpoTabela');
                
                if (filtrados.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                <p class="mt-2">Nenhum encaminhamento encontrado</p>
                            </td>
                        </tr>`;
                } else {
                    tbody.innerHTML = filtrados.map(e => {
                        const statusColor = {
                            'Pendente': 'warning',
                            'Enviado': 'info',
                            'Respondido': 'success',
                            'Cancelado': 'secondary'
                        }[e.status] || 'secondary';
                        
                        return `
                            <tr>
                                <td><small>${new Date(e.createdAt).toLocaleString('pt-BR')}</small></td>
                                <td><span class="badge bg-secondary">${e.analista || '-'}</span></td>
                                <td><strong>${e.titulo || '-'}</strong></td>
                                <td>${e.email || '-'}</td>
                                <td><span class="badge bg-${statusColor}">${e.status || '-'}</span></td>
                                <td>${e.flag ? '🚩' : '-'}</td>
                                <td><small>${e.observacoes || '-'}</small></td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editarEncaminhamento('${e.id}')">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    ${USUARIO_ATUAL.isAdmin ? `
                                        <button class="btn btn-sm btn-danger" onclick="excluirEncaminhamento('${e.id}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    ` : ''}
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('❌ Erro:', error);
                document.getElementById('corpoTabela').innerHTML = `
                    <tr><td colspan="8" class="text-center text-danger">Erro ao carregar dados</td></tr>`;
            }
        }

        // Editar
        window.editarEncaminhamento = async function(id) {
            try {
                const snapshot = await database.ref(`ENCAMINHAMENTOS/${id}`).once('value');
                const enc = snapshot.val();
                
                if (enc) {
                    document.getElementById('editId').value = id;
                    document.getElementById('editTitulo').value = enc.titulo || '';
                    document.getElementById('editEmail').value = enc.email || '';
                    document.getElementById('editStatus').value = enc.status || 'Pendente';
                    document.getElementById('editFlag').checked = enc.flag || false;
                    document.getElementById('editObservacoes').value = enc.observacoes || '';
                    
                    new bootstrap.Modal(document.getElementById('modalEdicao')).show();
                }
            } catch (error) {
                console.error('❌ Erro:', error);
                alert('Erro ao carregar dados');
            }
        };

        // Salvar edição
        window.salvarEdicao = async function() {
            const id = document.getElementById('editId').value;
            const dados = {
                titulo: document.getElementById('editTitulo').value,
                email: document.getElementById('editEmail').value,
                status: document.getElementById('editStatus').value,
                flag: document.getElementById('editFlag').checked,
                observacoes: document.getElementById('editObservacoes').value,
                updatedAt: Date.now()
            };
            
            try {
                await database.ref(`ENCAMINHAMENTOS/${id}`).update(dados);
                alert('✅ Encaminhamento atualizado!');
                bootstrap.Modal.getInstance(document.getElementById('modalEdicao')).hide();
                await carregarEncaminhamentos();
            } catch (error) {
                alert('❌ Erro: ' + error.message);
            }
        };

        // Excluir
        window.excluirEncaminhamento = async function(id) {
            if (!USUARIO_ATUAL.isAdmin) {
                alert('⛔ Apenas supervisores podem excluir!');
                return;
            }
            
            if (confirm('Tem certeza que deseja excluir?')) {
                try {
                    await database.ref(`ENCAMINHAMENTOS/${id}`).update({ deleted: true });
                    alert('✅ Excluído com sucesso!');
                    await carregarEncaminhamentos();
                } catch (error) {
                    alert('❌ Erro: ' + error.message);
                }
            }
        };

        window.pesquisarEncaminhamentos = function() {
            const filtros = {};
            
            const dataInicial = document.getElementById('dataInicial').value;
            const dataFinal = document.getElementById('dataFinal').value;
            
            if (dataInicial) filtros.dataInicial = new Date(dataInicial).getTime();
            if (dataFinal) filtros.dataFinal = new Date(dataFinal + 'T23:59:59').getTime();
            
            const titulo = document.getElementById('filtroTitulo').value.trim();
            const email = document.getElementById('filtroEmail').value.trim();
            const status = document.getElementById('filtroStatus').value;
            
            if (titulo) filtros.titulo = titulo;
            if (email) filtros.email = email;
            if (status) filtros.status = status;
            
            carregarEncaminhamentos(filtros);
        };

        window.limparFiltros = function() {
            document.getElementById('dataInicial').value = '';
            document.getElementById('dataFinal').value = '';
            document.getElementById('filtroTitulo').value = '';
            document.getElementById('filtroEmail').value = '';
            document.getElementById('filtroStatus').value = '';
            carregarEncaminhamentos();
        };

        window.limparFormulario = function() {
            document.getElementById('formEncaminhamento').reset();
            document.getElementById('analista').value = USUARIO_ATUAL.nome;
            atualizarDataHora();
        };

        window.addEventListener('DOMContentLoaded', inicializar);
    </script>
</body>
</html>
