<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navbar simples -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">SPS V2 - Chamados</span>
            <div class="d-flex">
                <span class="navbar-text me-3" id="userInfo">Desenvolvedor</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <!-- Seção 1: Inclusão -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Inclusão de Chamado</h5>
            </div>
            <div class="card-body">
                <form id="formChamado">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Analista</label>
                            <input type="text" class="form-control" id="analista" value="Desenvolvedor" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data/Hora</label>
                            <input type="text" class="form-control" id="dataHora" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Chamado *</label>
                            <input type="text" class="form-control" id="chamado" placeholder="C-1001" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Linha *</label>
                            <input type="text" class="form-control" id="linha" placeholder="5511999999999" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Equipamento</label>
                            <select class="form-select" id="equipamento">
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cenário</label>
                            <select class="form-select" id="cenario">
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Observações</label>
                            <textarea class="form-control" id="observacoes" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Salvar Chamado
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Seção 2: Lista de Chamados -->
        <div class="card">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="bi bi-table"></i> Chamados Registrados</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Data/Hora</th>
                                <th>Chamado</th>
                                <th>Linha</th>
                                <th>Equipamento</th>
                                <th>Cenário</th>
                                <th>Observações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr>
                                <td colspan="6" class="text-center">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDYnvcRKt4qDpk08_4MQVNEOr9Iq95X980",
            authDomain: "sps003hjr.firebaseapp.com",
            databaseURL: "https://sps003hjr-default-rtdb.firebaseio.com",
            projectId: "sps003hjr",
            storageBucket: "sps003hjr.firebasestorage.app",
            messagingSenderId: "294133615625",
            appId: "1:294133615625:web:832c4db972dcb1b92cbcd8"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        console.log('✅ Firebase inicializado');
        console.log('📊 Database:', database);

        // Função para carregar listas
        async function carregarListas() {
            try {
                console.log('📋 Carregando listas...');
                const snapshot = await database.ref('LISTAS').once('value');
                const listas = snapshot.val();
                
                console.log('✅ Listas recebidas:', listas);
                
                if (listas) {
                    // Preencher equipamentos
                    const selectEquip = document.getElementById('equipamento');
                    selectEquip.innerHTML = '<option value="">Selecione...</option>';
                    if (listas.equipamentos) {
                        listas.equipamentos.forEach(eq => {
                            selectEquip.innerHTML += `<option value="${eq}">${eq}</option>`;
                        });
                    }
                    
                    // Preencher cenários
                    const selectCen = document.getElementById('cenario');
                    selectCen.innerHTML = '<option value="">Selecione...</option>';
                    if (listas.cenarios) {
                        listas.cenarios.forEach(cen => {
                            selectCen.innerHTML += `<option value="${cen}">${cen}</option>`;
                        });
                    }
                    
                    console.log('✅ Dropdowns preenchidos');
                }
            } catch (error) {
                console.error('❌ Erro ao carregar listas:', error);
            }
        }

        // Função para salvar chamado
        async function salvarChamado(event) {
            event.preventDefault();
            
            const chamado = {
                chamado: document.getElementById('chamado').value,
                linha: document.getElementById('linha').value,
                equipamento: document.getElementById('equipamento').value,
                cenario: document.getElementById('cenario').value,
                observacoes: document.getElementById('observacoes').value,
                analista: 'Desenvolvedor',
                createdAt: Date.now(),
                deleted: false
            };

            console.log('💾 Salvando:', chamado);

            try {
                await database.ref('CHAMADOS').push(chamado);
                console.log('✅ Chamado salvo com sucesso!');
                alert('Chamado salvo com sucesso!');
                
                // Limpar formulário
                document.getElementById('formChamado').reset();
                
                // Recarregar lista
                carregarChamados();
            } catch (error) {
                console.error('❌ Erro ao salvar:', error);
                alert('Erro ao salvar: ' + error.message);
            }
        }

        // Função para carregar chamados
        async function carregarChamados() {
            try {
                console.log('🔍 Carregando chamados...');
                const snapshot = await database.ref('CHAMADOS').once('value');
                const chamados = [];
                
                snapshot.forEach(child => {
                    const data = child.val();
                    if (!data.deleted) {
                        chamados.push({
                            id: child.key,
                            ...data
                        });
                    }
                });
                
                // Ordenar por data (mais recentes primeiro)
                chamados.sort((a, b) => b.createdAt - a.createdAt);
                
                console.log(`✅ ${chamados.length} chamados carregados`);
                
                // Atualizar tabela
                const tbody = document.getElementById('corpoTabela');
                
                if (chamados.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Nenhum chamado encontrado</td></tr>';
                } else {
                    tbody.innerHTML = chamados.map(c => `
                        <tr>
                            <td>${new Date(c.createdAt).toLocaleString('pt-BR')}</td>
                            <td><strong>${c.chamado}</strong></td>
                            <td>${c.linha}</td>
                            <td>${c.equipamento || '-'}</td>
                            <td>${c.cenario || '-'}</td>
                            <td>${c.observacoes || '-'}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('❌ Erro ao carregar chamados:', error);
                document.getElementById('corpoTabela').innerHTML = 
                    '<tr><td colspan="6" class="text-center text-danger">Erro ao carregar dados</td></tr>';
            }
        }

        // Atualizar data/hora
        function atualizarDataHora() {
            document.getElementById('dataHora').value = new Date().toLocaleString('pt-BR');
        }

        // Inicializar página
        async function inicializar() {
            console.log('🚀 Inicializando página...');
            
            atualizarDataHora();
            setInterval(atualizarDataHora, 1000);
            
            await carregarListas();
            await carregarChamados();
            
            // Configurar evento de submit
            document.getElementById('formChamado').addEventListener('submit', salvarChamado);
            
            console.log('✅ Página inicializada!');
        }

        // Iniciar quando a página carregar
        window.addEventListener('DOMContentLoaded', inicializar);
    </script>
</body>
</html>
