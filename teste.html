<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Diagnóstico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>🔍 Diagnóstico de Conexão Firebase</h3>
            </div>
            <div class="card-body">
                <div id="status">
                    <div class="alert alert-info">
                        <strong>⏳ Testando conexão...</strong>
                        <div class="spinner-border spinner-border-sm ms-2" role="status"></div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button class="btn btn-primary" onclick="testarNovamente()">
                        🔄 Testar Novamente
                    </button>
                    <button class="btn btn-success" onclick="criarDadosTeste()">
                        🧪 Criar Dados de Teste
                    </button>
                    <button class="btn btn-warning" onclick="criarEstrutura()">
                        🔧 Criar Estrutura Inicial
                    </button>
                </div>
                
                <div class="mt-3" id="detalhes" style="display:none;">
                    <h5>📊 Detalhes da Conexão:</h5>
                    <pre id="detalhesConexao" class="bg-light p-3"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { testarConexao, criarEstruturaInicial, criarDadosTeste } from './js/testConnection.js';
        
        // Funções globais
        window.testarNovamente = async function() {
            document.getElementById('status').innerHTML = `
                <div class="alert alert-info">
                    <strong>⏳ Testando conexão...</strong>
                    <div class="spinner-border spinner-border-sm ms-2" role="status"></div>
                </div>
            `;
            
            const resultado = await testarConexao();
            
            if (resultado) {
                document.getElementById('status').innerHTML = `
                    <div class="alert alert-success">
                        <strong>✅ Conexão bem sucedida!</strong>
                        Firebase está respondendo corretamente.
                    </div>
                `;
            } else {
                document.getElementById('status').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Falha na conexão!</strong>
                        Verifique o console (F12) para mais detalhes.
                    </div>
                `;
            }
        };
        
        window.criarDadosTeste = async function() {
            await criarDadosTeste();
            alert('Dados de teste criados! Verifique o console.');
        };
        
        window.criarEstrutura = async function() {
            await criarEstruturaInicial();
            alert('Estrutura inicial criada! Verifique o console.');
        };
        
        // Teste automático
        window.testarNovamente();
    </script>
</body>
</html>
