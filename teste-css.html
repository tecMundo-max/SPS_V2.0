<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste CSS - SPS V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Teste 1: CSS local -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* CSS de emergência - se o arquivo não carregar, usa este */
        @import url('css/style.css') screen and (min-width: 1px);
        
        body {
            background-color: #1a1a1a !important;
            color: #ffffff !important;
        }
        
        .test-box {
            background: #242424;
            border: 2px solid #DA291C;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="test-box">
            <h2 style="color: #DA291C;">
                <i class="bi bi-check-circle"></i> Teste de CSS
            </h2>
            
            <div class="alert" style="background: #333; color: #fff; margin-top: 20px;">
                <strong>Status do CSS:</strong>
                <ul>
                    <li>Cor de fundo deve ser: <span style="color: #DA291C;">#1a1a1a (escuro)</span></li>
                    <li>Borda deve ser: <span style="color: #DA291C;">#DA291C (vermelho Claro)</span></li>
                    <li>Se estiver claro, o CSS NÃO carregou</li>
                </ul>
            </div>
            
            <div class="row mt-4">
                <div class="col-md-4">
                    <button class="btn btn-primary">Botão Primário</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-success">Botão Success</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-danger">Botão Danger</button>
                </div>
            </div>
            
            <div class="mt-4">
                <input type="text" class="form-control" placeholder="Input de teste">
            </div>
            
            <div class="mt-3">
                <span class="badge bg-primary">Badge Primary</span>
                <span class="badge bg-success">Badge Success</span>
                <span class="badge bg-warning">Badge Warning</span>
                <span class="badge bg-danger">Badge Danger</span>
            </div>
        </div>
        
        <div class="test-box mt-4">
            <h3 style="color: #DA291C;">Diagnóstico:</h3>
            <div id="diagnostico" style="color: #fff;"></div>
        </div>
    </div>

    <script>
        // Verificar se o CSS carregou
        window.addEventListener('load', function() {
            const diagnostico = document.getElementById('diagnostico');
            const bodyStyle = window.getComputedStyle(document.body);
            const bgColor = bodyStyle.backgroundColor;
            
            let html = '';
            html += `<p>📁 Cor de fundo detectada: <strong>${bgColor}</strong></p>`;
            
            if (bgColor === 'rgb(26, 26, 26)' || bgColor === '#1a1a1a') {
                html += '<p style="color: #4CAF50;">✅ CSS carregado com sucesso!</p>';
            } else {
                html += '<p style="color: #F44336;">❌ CSS NÃO carregou corretamente</p>';
                html += '<p>Soluções:</p>';
                html += '<ul>';
                html += '<li>Verifique se o arquivo <code>css/style.css</code> existe</li>';
                html += '<li>O GitHub Pages é case-sensitive: use <code>css</code> (minúsculo)</li>';
                html += '<li>Tente acessar: <a href="css/style.css" target="_blank">css/style.css</a></li>';
                html += '</ul>';
            }
            
            diagnostico.innerHTML = html;
        });
    </script>
</body>
</html>
