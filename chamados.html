<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <img src="assets/logo/logo.png" alt="SPS V2" height="30" class="d-inline-block align-top">
                SPS V2
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="chamados.html">Chamados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="encaminhamentos.html">Encaminhamentos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="novos_servicos.html">Novos Serviços</a>
                    </li>
                    <li class="nav-item" id="menuUsuarios" style="display:none;">
                        <a class="nav-link" href="usuarios.html">Usuários</a>
                    </li>
                    <li class="nav-item" id="menuConfig" style="display:none;">
                        <a class="nav-link" href="configuracoes.html">Configurações</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <span class="navbar-text me-3" id="userInfo"></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container-fluid mt-3">
        <!-- Seção 1: Inclusão de Chamado -->
        <div class="section-container mb-4">
            <div class="section-header">
                <h5><i class="bi bi-plus-circle"></i> Inclusão de Chamado</h5>
            </div>
            <div class="section-body">
                <form id="formChamado">
                    <div class="row g-3">
                        <!-- Linha 1 -->
                        <div class="col-md-3">
                            <label class="form-label">Analista</label>
                            <input type="text" class="form-control" id="analista" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data/Hora</label>
                            <input type="text" class="form-control" id="dataHora" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Chamado <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="chamado" placeholder="C-1001" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Linha <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="linha" placeholder="5511999999999" required>
                        </div>
                        
                        <!-- Linha 2 -->
                        <div class="col-md-3">
                            <label class="form-label">Equipamento</label>
                            <select class="form-select" id="equipamento">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cenário</label>
                            <select class="form-select" id="cenario">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="email@exemplo.com">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Flag</label>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="flag">
                                <label class="form-check-label" for="flag">Marcar flag</label>
                            </div>
                        </div>
                        
                        <!-- Linha 3 -->
                        <div class="col-md-8">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" placeholder="Título do chamado">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">&nbsp;</label>
                            <div class="d-grid gap-2 d-md-flex">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Salvar
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                            </div>
                        </div>
                        
                        <!-- Linha 4 -->
                        <div class="col-12">
                            <label class="form-label">Observações</label>
                            <textarea class="form-control" id="observacoes" rows="2" placeholder="Observações do chamado..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Seção 2: Pesquisa -->
        <div class="section-container mb-4">
            <div class="section-header">
                <h5><i class="bi bi-search"></i> Pesquisa</h5>
            </div>
            <div class="section-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Data Inicial</label>
                        <input type="date" class="form-control" id="dataInicial">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Final</label>
                        <input type="date" class="form-control" id="dataFinal">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Analista</label>
                        <input type="text" class="form-control" id="filtroAnalista" placeholder="Nome analista">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Chamado</label>
                        <input type="text" class="form-control" id="filtroChamado" placeholder="C-1001">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Linha</label>
                        <input type="text" class="form-control" id="filtroLinha" placeholder="55119...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <div class="d-grid gap-2 d-md-flex">
                            <button class="btn btn-primary" onclick="pesquisar()">
                                <i class="bi bi-search"></i> Pesquisar
                            </button>
                            <button class="btn btn-info" onclick="filtrarHoje()">
                                Hoje
                            </button>
                            <button class="btn btn-secondary" onclick="limparFiltros()">
                                <i class="bi bi-x-circle"></i> Limpar
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mt-2">
                    <span class="badge bg-primary">Total: <span id="totalRegistros">0</span></span>
                </div>
            </div>
        </div>

        <!-- Seção 3: Resultados -->
        <div class="section-container">
            <div class="section-header">
                <h5><i class="bi bi-table"></i> Resultados</h5>
            </div>
            <div class="section-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tabelaChamados">
                        <thead class="table-dark">
                            <tr>
                                <th>Data/Hora</th>
                                <th>Analista</th>
                                <th>Chamado</th>
                                <th>Linha</th>
                                <th>Equipamento</th>
                                <th>Cenário</th>
                                <th>Título</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela">
                            <tr>
                                <td colspan="8" class="text-center">Nenhum chamado encontrado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-center mt-3" id="botaoMostrarMais" style="display:none;">
                    <button class="btn btn-outline-primary" onclick="carregarMais()">
                        <i class="bi bi-arrow-down-circle"></i> Mostrar Mais (20)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div class="modal fade" id="modalEdicao" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Chamado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEdicao">
                        <input type="hidden" id="editId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Chamado</label>
                                <input type="text" class="form-control" id="editChamado" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Linha</label>
                                <input type="text" class="form-control" id="editLinha" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Equipamento</label>
                                <select class="form-select" id="editEquipamento">
                                    <option value="">Selecione...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cenário</label>
                                <select class="form-select" id="editCenario">
                                    <option value="">Selecione...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="editTitulo">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" id="editObservacoes" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarEdicao()">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/chamados.js"></script>
</body>
</html>
