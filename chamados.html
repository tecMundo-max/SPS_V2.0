<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Chamados</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .card-header {
            font-weight: bold;
        }
        
        #formChamado .form-label {
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        
        .table th {
            font-size: 0.85rem;
            white-space: nowrap;
        }
        
        .table td {
            font-size: 0.85rem;
            vertical-align: middle;
        }
        
        .badge {
            font-size: 0.8rem;
        }
        
        .btn-group-sm .btn {
            padding: 0.15rem 0.4rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-headset"></i> SPS V2
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="chamados.html">
                            <i class="bi bi-ticket-detailed"></i> Chamados
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html">
                            <i class="bi bi-people"></i> Usuários
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center text-white">
                    <i class="bi bi-person-circle me-2"></i>
                    <span id="usuarioLogado" class="me-3">Carregando...</span>
                    <button id="btnSair" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container-fluid mt-3">
        
        <!-- ============================================================ -->
        <!-- SEÇÃO 1 - INCLUSÃO DE CHAMADO -->
        <!-- ============================================================ -->
        <div class="card mb-3">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-plus-circle"></i> Inclusão de Chamado
                </h5>
            </div>
            <div class="card-body">
                <form id="formChamado">
                    <!-- Linha 1 -->
                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label class="form-label">Analista:</label>
                            <input type="text" class="form-control form-control-sm" id="analista" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data/Hora:</label>
                            <input type="text" class="form-control form-control-sm" id="dataHora" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Chamado:</label>
                            <input type="text" class="form-control form-control-sm" id="chamado" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">MSISDN:</label>
                            <input type="text" class="form-control form-control-sm" id="msisdn" placeholder="(99) 99999-9999" maxlength="15">
                        </div>
                    </div>

                    <!-- Linha 2 -->
                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label class="form-label">Equipamento:</label>
                            <select class="form-select form-select-sm" id="equipamento">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cenário:</label>
                            <select class="form-select form-select-sm" id="cenario">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Observações:</label>
                            <textarea class="form-control form-control-sm" id="observacoes" rows="2"></textarea>
                        </div>
                    </div>

                    <!-- Linha 3 -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">E-mail:</label>
                            <input type="email" class="form-control form-control-sm" id="email" placeholder="email@exemplo.com">
                        </div>
                        <div class="col-md-1">
                            <label class="form-label">s/n flag:</label>
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" id="flag">
                            </div>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label">Título do Email:</label>
                            <input type="text" class="form-control form-control-sm" id="tituloEmail" placeholder="Título do email">
                        </div>
                    </div>

                    <!-- Botões -->
                    <div class="row">
                        <div class="col-12">
                            <button type="button" class="btn btn-primary btn-sm" id="btnSalvar">
                                <i class="fas fa-save"></i> Salvar
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" id="btnCancelar">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- SEÇÃO 2 - PESQUISA -->
        <!-- ============================================================ -->
        <div class="card mb-3">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-search"></i> Pesquisa
                </h5>
            </div>
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">Número:</label>
                        <input type="text" class="form-control form-control-sm" id="buscaNumero" placeholder="Nº chamado">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">MSISDN:</label>
                        <input type="text" class="form-control form-control-sm" id="buscaMSISDN" placeholder="(99) 99999-9999">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Cliente:</label>
                        <input type="text" class="form-control form-control-sm" id="buscaCliente" placeholder="Nome/Email">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status:</label>
                        <select class="form-select form-select-sm" id="filtroStatus">
                            <option value="TODOS">Todos</option>
                            <option value="ABERTO">Aberto</option>
                            <option value="EXECUCAO">Execução</option>
                            <option value="AGUARDANDO">Aguardando</option>
                            <option value="FINALIZADO">Finalizado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Inicial:</label>
                        <input type="date" class="form-control form-control-sm" id="dataInicial">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Final:</label>
                        <input type="date" class="form-control form-control-sm" id="dataFinal">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <button class="btn btn-primary btn-sm" id="btnBuscar">
                            <i class="fas fa-search"></i> Buscar
                        </button>
                        <button class="btn btn-outline-secondary btn-sm" id="btnLimparFiltros">
                            <i class="fas fa-times"></i> Limpar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- SEÇÃO 3 - RESULTADO DA PESQUISA -->
        <!-- ============================================================ -->
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="fas fa-list"></i> Resultado da Pesquisa
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Número</th>
                                <th>Data/Hora</th>
                                <th>Analista</th>
                                <th>MSISDN</th>
                                <th>Equipamento</th>
                                <th>Cenário</th>
                                <th>E-mail</th>
                                <th>Status</th>
                                <th>Observações</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaChamados">
                            <!-- Dados carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Rodapé -->
            <div class="card-footer">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-muted" id="infoRegistros">Carregando...</small>
                    <div id="paginacaoChamados"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase Module -->
    <script type="module">
        import { initChamados } from './js/pages/chamados.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            initChamados();
        });
    </script>
</body>
</html>
