<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS V2 - Chamados</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .section-header {
            font-weight: bold;
            font-size: 0.95rem;
        }
        
        .form-label {
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        
        .table th {
            font-size: 0.8rem;
            white-space: nowrap;
            background: #212529;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .table td {
            font-size: 0.8rem;
            vertical-align: middle;
        }
        
        .table-responsive {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .btn-action {
            padding: 0.15rem 0.4rem;
            font-size: 0.75rem;
        }
        
        .card {
            border: 1px solid #dee2e6;
            margin-bottom: 1rem;
        }
        
        .card-header {
            padding: 0.5rem 1rem;
        }
        
        .card-body {
            padding: 0.75rem;
        }
        
        #totalEncontrado {
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-headset"></i> SPS V2
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="chamados.html">
                            <i class="bi bi-ticket-detailed"></i> Chamados
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html">
                            <i class="bi bi-people"></i> Usuários
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center text-white">
                    <i class="bi bi-person-circle me-2"></i>
                    <span id="usuarioLogado" class="me-3">Carregando...</span>
                    <button id="btnSair" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container-fluid mt-3">
        
        <!-- ============================================================ -->
        <!-- SEÇÃO 1 - INCLUSÃO DE CHAMADO -->
        <!-- ============================================================ -->
        <div class="card">
            <div class="card-header bg-primary text-white section-header">
                <i class="bi bi-plus-circle"></i> Inclusão de Chamado
            </div>
            <div class="card-body">
                <form id="formChamado">
                    <input type="hidden" id="chamadoId">
                    
                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label class="form-label">Analista:</label>
                            <input type="text" class="form-control form-control-sm" id="analista" readonly>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Data/Hora:</label>
                            <input type="datetime-local" class="form-control form-control-sm" id="data">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Chamado *:</label>
                            <input type="text" class="form-control form-control-sm" id="chamado" placeholder="Ex: C-1001" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Linha (MSISDN):</label>
                            <input type="text" class="form-control form-control-sm" id="linha" placeholder="(99) 99999-9999" maxlength="15">
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-3">
                            <label class="form-label">Equipamento:</label>
                            <select class="form-select form-select-sm" id="equipamentoSelect">
                                <option value="">(selecione)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cenário:</label>
                            <select class="form-select form-select-sm" id="cenarioSelect">
                                <option value="">(selecione)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Observações:</label>
                            <textarea class="form-control form-control-sm" id="observacoes" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-save"></i> Salvar
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" id="btnCancelar">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- SEÇÃO 2 - PESQUISA -->
        <!-- ============================================================ -->
        <div class="card">
            <div class="card-header bg-secondary text-white section-header">
                <i class="bi bi-search"></i> Pesquisa
            </div>
            <div class="card-body">
                <div class="row align-items-end mb-2">
                    <div class="col-md-2">
                        <label class="form-label">Data Inicial:</label>
                        <input type="date" class="form-control form-control-sm" id="fDataIni">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Final:</label>
                        <input type="date" class="form-control form-control-sm" id="fDataFim">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Analista:</label>
                        <input type="text" class="form-control form-control-sm" id="fAnalista" placeholder="Nome">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Chamado:</label>
                        <input type="text" class="form-control form-control-sm" id="fChamado" placeholder="C-1001">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Linha:</label>
                        <input type="text" class="form-control form-control-sm" id="fLinha" placeholder="99999-9999">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Equipamento:</label>
                        <select class="form-select form-select-sm" id="fEquipamento">
                            <option value="">Todos</option>
                        </select>
                    </div>
                </div>
                <div class="row align-items-end">
                    <div class="col-md-2">
                        <label class="form-label">Cenário:</label>
                        <select class="form-select form-select-sm" id="fCenario">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-10">
                        <button type="button" class="btn btn-primary btn-sm" id="btnPesquisar">
                            <i class="bi bi-search"></i> Pesquisar
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btnHoje">
                            <i class="bi bi-calendar-day"></i> Hoje
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLimpar">
                            <i class="bi bi-x-circle"></i> Limpar
                        </button>
                        <span id="totalEncontrado" class="ms-3">Total encontrado: 0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- SEÇÃO 3 - RESULTADO (20 linhas + botão MAIS) -->
        <!-- ============================================================ -->
        <div class="card">
            <div class="card-header bg-dark text-white section-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul"></i> Resultado da Pesquisa</span>
                <button id="btnMais" class="btn btn-success btn-sm" style="display:none;">
                    <i class="bi bi-plus-circle"></i> Mostrar Mais
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tblChamados">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Analista</th>
                                <th>Chamado</th>
                                <th>Linha</th>
                                <th>Equipamento</th>
                                <th>Cenário</th>
                                <th>Observações</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999;">
        <div class="spinner-border text-primary"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Módulo da Página -->
    <script type="module">
        import { initChamados } from './js/pages/chamados.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            initChamados();
        });
    </script>
</body>
</html>
